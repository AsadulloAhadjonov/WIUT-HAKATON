# Barcha sozlanadigan qiymatlar shu yerda. Kodga raqam yozmang — shu faylga yozing.
# Ablatsiya uchun nusxa oling (params_fast.yaml ...) va TRAFFIC_PARAMS=... bilan ishga tushiring.

seed: 42
scene_file: configs/scene.yaml
use_cache: true          # Part A treklarini cache/ ga yozadi (faqat Part A, RiskEstimator ishlatmaydi)
cache_dir: cache

detector:
  weights: weights/yolov8s.pt   # REPODA turadi, internetdan yuklanmaydi
  imgsz: 640
  conf: 0.20
  iou: 0.5
  device: auto                  # auto | cpu | cuda:0
  half: false                   # GPU'da true — tezroq (determinizmni tekshiring)
  batch: 8
  classes:                      # COCO id -> bizdagi nom
    0: person
    1: bicycle
    2: car
    3: motorcycle
    5: bus
    7: truck

tracker:                        # ByteTrack (ultralytics)
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  match_thresh: 0.8
  track_buffer_s: 1.5           # yo'qolgan trek necha soniya saqlanadi

sampling:
  target_fps: 10                # detektor chastotasi; 25 fps video → har 2-kadr (vaqt byudjeti!)

features:
  smooth_window_s: 0.6
  min_track_len_s: 0.5
  drop_riders: true             # transport ichidagi/ustidagi odamlar piyoda hisoblanmaydi
  rider_overlap: 0.6

# ---------------------------------------------------------------------------------------------
# HODISALAR. `class` — solution.py dagi CLASSES dan AYNAN nom bo'lishi kerak.
# 14 ta rasmiy sinf: accident, near_miss, red_light, wrong_way, illegal_u_turn,
#   stopped_vehicle, jaywalking, failure_to_yield, illegal_turn, solid_line_crossing,
#   stop_line, congestion, road_obstacle, fire_smoke
#
# Tezlik birligi: scene.yaml da homography bo'lsa m/s, bo'lmasa "o'lcham/s"
# (bbox sqrt(w*h) si sekundiga; ~1.0 = obyekt sekundiga o'z o'lchamicha siljiydi).
# ---------------------------------------------------------------------------------------------
events:

  # 1. accident — to'qnashuv (bbox kesishadi, biri harakatda bo'lgan, keyin ikkalasi to'xtaydi)
  - class: accident
    rule: accident
    objects_a: [car, bus, truck, motorcycle]
    objects_b: [car, bus, truck, motorcycle, person, bicycle]
    iou_min: 0.08
    min_speed_before: 0.4
    stop_speed: 0.12
    post_stop_s: 2.0
    pre_s: 0.0          # PDFda: Start = birinchi kontakt kadri
    post_s: 3.0

  # 2. near_miss — xavfli yaqinlashish (TTC kichik, lekin hali to'qnashuv yo'q)
  - class: near_miss
    rule: near_miss
    objects_a: [car, bus, truck, motorcycle]
    objects_b: [person, bicycle, car, bus, truck, motorcycle]
    ttc_max_s: 2.0
    margin: 0.8
    max_dist: 3.5
    min_speed: 0.25
    iou_contact: 0.05
    min_duration_s: 0.3
    pad_s: 1.0

  # 3. red_light — qizil chiroqda stop_line ni kesib chorrahaga kirish
  - class: red_light
    rule: red_light
    line: stop_line
    objects: [car, bus, truck, motorcycle]
    pre_s: 0.5
    post_s: 2.0
    # Svetofor aniqlanmasa ham — stop_line dan o'tgan barcha transport yoziladi
    enabled: true

  # 4. wrong_way — polosa yo'nalishiga qarshi harakat (scene.yaml da lanes kerak)
  - class: wrong_way
    rule: wrong_way
    objects: [car, bus, truck, motorcycle, bicycle]
    min_speed: 0.3
    cos_threshold: 0.4
    min_duration_s: 1.0

  # 5. illegal_u_turn — noqonuniy U-burilish
  - class: illegal_u_turn
    rule: u_turn
    objects: [car, bus, truck, motorcycle]
    min_speed: 0.2
    window_s: 8.0
    min_angle_deg: 140

  # 6. stopped_vehicle — yo'lda to'xtab qolgan transport (PDFda: ≥ 10 soniya)
  - class: stopped_vehicle
    rule: stopped
    objects: [car, bus, truck, motorcycle]
    zones: [roadway]
    max_speed: 0.08
    min_duration_s: 3.0     # Sintetik video qisqa (14s) shuning uchun 3s

  # 7. jaywalking — piyodaning yo'lda to'g'ri bo'lmagan joyda yurishi
  - class: jaywalking
    rule: in_zone
    objects: [person]
    zones: [roadway]
    exclude_zones: [crosswalk]
    min_duration_s: 1.0
    min_speed: 0.05

  # 8. failure_to_yield — o'tish joyida piyodaga yo'l bermaslik
  - class: failure_to_yield
    rule: failure_to_yield
    objects_vehicles: [car, bus, truck, motorcycle]
    objects_pedestrians: [person]
    veh_min_speed: 0.2
    min_duration_s: 0.5
    pad_s: 0.5

  # 9. illegal_turn — taqiqlangan burilish (yo'nalish chizig'ini kesib yoki noto'g'ri yo'nalishga)
  - class: illegal_turn
    rule: illegal_turn
    objects: [car, bus, truck, motorcycle]
    min_speed: 0.25
    turn_angle_deg: 70.0
    window_s: 5.0
    min_duration_s: 0.5
    line: no_turn_line   # agar scene.yaml da bo'lsa

  # 10. solid_line_crossing — uzluksiz chiziqni kesib o'tish (polosa kesish)
  - class: solid_line_crossing
    rule: solid_line_crossing
    objects: [car, bus, truck, motorcycle, bicycle]
    line: solid_line     # scene.yaml da solid_line bo'lsa
    min_stable_s: 0.8    # polosa_change uchun fallback
    pre_s: 0.5
    post_s: 1.5

  # 11. stop_line — chiziqdan o'tib to'xtash (chiziqdan ilib o'tish)
  - class: stop_line
    rule: stop_line
    objects: [car, bus, truck, motorcycle]
    line: stop_line
    pre_s: 1.0
    post_s: 3.0
    stop_speed: 0.08

  # 12. congestion — tirbandlik (zonada ko'p sekin mashina)
  - class: congestion
    rule: congestion
    objects: [car, bus, truck, motorcycle]
    zones: [roadway]
    max_speed: 0.1
    min_count: 5
    min_duration_s: 8.0

  # 13. road_obstacle — yo'ldagi to'siq
  - class: road_obstacle
    rule: road_obstacle
    objects: [person, bicycle, motorcycle, car, bus, truck]
    zones: [roadway]
    max_speed: 0.05
    min_duration_s: 5.0

  # 14. fire_smoke — olov va tutun (kamera sahnasida)
  - class: fire_smoke
    rule: fire_smoke
    min_duration_s: 1.0
    pad_s: 1.0

postprocess:
  default:
    merge_gap_s: 1.0
    min_len_s: 0.5
    pad_s: 0.0
  per_class:
    near_miss: {merge_gap_s: 1.0, min_len_s: 0.3}
    accident: {merge_gap_s: 3.0, min_len_s: 0.5}
    solid_line_crossing: {merge_gap_s: 0.5, min_len_s: 0.5}
    congestion: {merge_gap_s: 5.0, min_len_s: 8.0}
    stopped_vehicle: {merge_gap_s: 3.0, min_len_s: 8.0}
    jaywalking: {merge_gap_s: 1.0, min_len_s: 0.5}
    failure_to_yield: {merge_gap_s: 0.5, min_len_s: 0.3}
    red_light: {merge_gap_s: 0.5, min_len_s: 0.3}
    stop_line: {merge_gap_s: 1.0, min_len_s: 0.5}
    road_obstacle: {merge_gap_s: 3.0, min_len_s: 4.0}
    fire_smoke: {merge_gap_s: 2.0, min_len_s: 1.0}

# ---------------------------------------------------------------------------------------------
# PART B — onlayn xavf (src/risk.py)
# ---------------------------------------------------------------------------------------------
risk:
  vel_window_s: 0.6
  stale_s: 1.0
  tau_ttc_s: 1.5
  ttc_margin: 0.8
  tau_dist: 0.5
  min_speed: 0.25
  w_density: 0.12
  density_ref: 20
  ema_up: 0.5          # xavf ko'tarilganda tez reaksiya
  ema_down: 0.1        # pasayganda sekin
  # Qo'shni polosa filtri — yo'nalish mos bo'lsa xavf kamaytiradi
  lane_dir_bonus: true
  max_lateral_dist_lanes: 2.0  # polosa kengligi (piksel o'lcham birligida)
